services:
  fnos-docker-updater:
    build: .
    container_name: fnos-docker-updater
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      # 挂载宿主机 Docker Socket 以读取和管理容器（必须）
      - /var/run/docker.sock:/var/run/docker.sock
      # 挂载 SQLite 数据库及配置持久化目录
      - ./data:/data
      # 如果飞牛 NAS 存储卷有自定义路径，可在此按需挂载，如：
      # - /vol1:/vol1
    environment:
      - TZ=Asia/Shanghai
      - PORT=5678
      - HOST=0.0.0.0
      - JWT_SECRET=fnos-updater-secure-secret-please-change
