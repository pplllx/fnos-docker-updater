services:
  fnos-docker-updater:
    image: ghcr.io/pplllx/fnos-docker-updater:latest
    build: .
    container_name: fnos-docker-updater
    restart: unless-stopped
    # 采用 host 主机网络模式：性能最高，且彻底避免 Docker 虚拟网段耗尽问题
    network_mode: host
    volumes:
      # 挂载宿主机 Docker Socket 以读取和管理容器（必须）
      - /var/run/docker.sock:/var/run/docker.sock
      # 挂载 SQLite 数据库及配置持久化目录
      - ./data:/data
      # 挂载宿主机项目目录以便读取和更新 Compose 项目
      - /home:/home
      - /vol1:/vol1
      - /vol2:/vol2
    environment:
      - TZ=Asia/Shanghai
      - PORT=5688
      - HOST=0.0.0.0
      - JWT_SECRET=fnos-updater-secure-secret-please-change
